[GNSS-SDR]

; Mars GPS L1 C/A replay configuration with telemetry diagnostics enabled.
; Set GNSS_SDR_MARS_SYNC_DEBUG=1 to include tracker/decoder timeline logs.

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=4000000
GNSS-SDR.observable_interval_ms=20
GNSS-SDR.telecommand_enabled=true
GNSS-SDR.telecommand_tcp_port=3333
GNSS-SDR.AGNSS_XML_enabled=true
GNSS-SDR.AGNSS_gps_ephemeris_xml=./gps_mars_ephemeris.xml
GNSS-SDR.AGNSS_gps_iono_xml=./gps_iono.xml
GNSS-SDR.AGNSS_gps_utc_model_xml=./gps_utc_model.xml

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=./Mars 3 minutes/2026_03_24_06_32_53_UTC_plus_13_00_capture_L1_30.00Msps_5_10_0.0dB_V1_A1_1.int8
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=30000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER L1 CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Direct_Resampler
Resampler.sample_freq_in=30000000
Resampler.sample_freq_out=4000000
Resampler.item_type=gr_complex

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=7
Channels.in_acquisition=7
Channels_1C.SignalSource_ID=0
Channel0.satellite=12
Channel1.satellite=15
Channel2.satellite=16
Channel3.satellite=21
Channel4.satellite=2
Channel5.satellite=5
Channel6.satellite=22

;######### ACQUISITION GPS L1 CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=15000
Acquisition_1C.doppler_step=125
Acquisition_1C.blocking=true

;######### TRACKING FOR GPS L1 C/A CHANNELS ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.15
Tracking_1C.pll_bw_hz=50
Tracking_1C.dll_bw_hz=10.0
Tracking_1C.pll_filter_order=3
Tracking_1C.carrier_lock_th=0.05
Tracking_1C.cn0_min=0
Tracking_1C.max_lock_fail=300000
Tracking_1C.max_carrier_lock_fail=300000
Tracking_1C.bit_synchronization_time_limit_s=60
Tracking_1C.high_dyn=true
Tracking_1C.enable_fll_steady_state=false
Tracking_1C.fll_bw_hz=20
Tracking_1C.extend_correlation_symbols=20

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.enable_costas_branch_repair=true
TelemetryDecoder_1C.dump=true
TelemetryDecoder_1C.dump_filename=./diag_tlm
TelemetryDecoder_1C.dump_mat=false
TelemetryDecoder_1C.dump_crc_stats=true
TelemetryDecoder_1C.dump_crc_stats_filename=./diag_tlm_crc

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single_2D
PVT.fixed_height_2d_m=0.0
PVT.fixed_height_2d_sigma_m=25.0
PVT.initial_latitude_deg=0.0
PVT.initial_longitude_deg=0.0
PVT.initial_height_m=0.0
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.elevation_mask=-35.0
PVT.dump=true
PVT.nmea_dump_filename=./gnss_sdr_pvt.nmea
PVT.dump_mat=true
PVT.dump_filename=./PVT
PVT.enable_monitor=true
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111

;######### MONITOR CONFIG ############
Monitor.enable_monitor=true
Monitor.decimation_factor=1
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
