[GNSS-SDR]

; Mars Molli L1/C/A replay using decoded/assisted NAV ephemerides with a
; Mars body-frame phase aid. This intentionally does not replace satellite
; positions with the simulator state table.

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=4000000
GNSS-SDR.observable_interval_ms=20
GNSS-SDR.telecommand_enabled=false
GNSS-SDR.AGNSS_XML_enabled=true
GNSS-SDR.AGNSS_gps_ephemeris_xml=./gps_mars_molli_32_5min_nav_ephemeris.xml
GNSS-SDR.AGNSS_gps_iono_xml=./gps_iono.xml
GNSS-SDR.AGNSS_gps_utc_model_xml=./gps_time_utc_model.xml
GPS.prns=1,6,12,16,17,21,22,26,27,31,32

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=./Mars Molli 32 5 min/Mars_IQ_5_minutes_32_SV/2026_06_23_11_20_48_UTC_plus_00_00_capture_L1_30.00Msps_5_10_0.0dB_V1_A1_1.int8
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=30000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER L1 CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Direct_Resampler
Resampler.sample_freq_in=30000000
Resampler.sample_freq_out=4000000
Resampler.item_type=gr_complex

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=10
Channels.in_acquisition=10
Channels_1C.SignalSource_ID=0
Channel0.satellite=1
Channel1.satellite=6
Channel2.satellite=12
Channel3.satellite=16
Channel4.satellite=17
Channel5.satellite=21
Channel6.satellite=22
Channel7.satellite=26
Channel8.satellite=27
Channel9.satellite=31

;######### ACQUISITION GPS L1 CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.coherent_integration_time_ms=10
Acquisition_1C.bit_transition_flag=true
Acquisition_1C.doppler_max=15000
Acquisition_1C.doppler_step=125
Acquisition_1C.blocking=true

;######### TRACKING FOR GPS L1 C/A CHANNELS ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.15
Tracking_1C.pll_bw_hz=50
Tracking_1C.dll_bw_hz=10.0
Tracking_1C.pll_bw_narrow_hz=5
Tracking_1C.dll_bw_narrow_hz=0.75
Tracking_1C.pll_filter_order=3
Tracking_1C.carrier_lock_th=0.05
Tracking_1C.cn0_min=0
Tracking_1C.max_lock_fail=300000
Tracking_1C.max_carrier_lock_fail=300000
Tracking_1C.bit_synchronization_time_limit_s=180
Tracking_1C.bit_sync_preamble_min_total_evidence_ratio=0.875
Tracking_1C.bit_sync_preamble_min_bit_evidence_ratio=0.60
Tracking_1C.high_dyn=true
Tracking_1C.enable_fll_steady_state=true
Tracking_1C.fll_bw_hz=15
Tracking_1C.extend_correlation_symbols=20

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.enable_costas_branch_repair=true
TelemetryDecoder_1C.enable_assisted_tow=true
TelemetryDecoder_1C.assisted_nav_bits_file=./gps_mars_molli_32_5min_navbits.csv
TelemetryDecoder_1C.assisted_nav_min_match_bits=295
TelemetryDecoder_1C.assisted_tow_start_ms=88441000
TelemetryDecoder_1C.assisted_tow_min_preamble_score=6
TelemetryDecoder_1C.assisted_tow_light_time_ms=20
TelemetryDecoder_1C.assisted_tow_boundary_tolerance_ms=140
TelemetryDecoder_1C.assisted_tow_min_cn0_dbhz=15
TelemetryDecoder_1C.apply_ephemeris_frame_alignment=false
TelemetryDecoder_1C.ephemeris_mars_frame_phase_offset_s=0.0
TelemetryDecoder_1C.ephemeris_time_offset_s=0.0
TelemetryDecoder_1C.dump_crc_stats=true
TelemetryDecoder_1C.dump_crc_stats_filename=./build/molli_nav_spice_aided_tlm_crc

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.rx_tow_init_offset_ms=20

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single_2D
PVT.output_rate_ms=500
PVT.display_rate_ms=500
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.elevation_mask=-90.0
PVT.raim_fde=1
PVT.initial_latitude_deg=0.0
PVT.initial_longitude_deg=0.0
PVT.initial_height_m=0.0
PVT.fixed_height_2d_m=0.0
PVT.fixed_height_2d_sigma_m=5.0
PVT.fixed_height_2d_min_observations=4
PVT.enable_spice_derived_sat_positions=false
PVT.enable_spice_nav_frame=true
PVT.spice_meta_kernel=./SPICE/gnss_sdr_mars.tm
PVT.spice_nav_inertial_frame=J2000
PVT.spice_nav_body_frame=IAU_MARS
PVT.enable_code_phase_ms_ambiguity_correction=true
PVT.code_phase_ms_ambiguity_max_ms=5
PVT.code_phase_ms_ambiguity_residual_threshold_m=100000.0
PVT.code_phase_ms_ambiguity_min_improvement_m=50000.0
PVT.dump=true
PVT.nmea_dump_filename=./build/gnss_sdr_molli_nav_spice_aided_pvt.nmea
PVT.dump_mat=false
PVT.dump_filename=./build/PVT_molli_nav_spice_aided
PVT.geojson_output_enabled=true
PVT.geojson_output_path=./build/molli_nav_spice_aided_geojson
PVT.enable_monitor=false
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111

;######### MONITOR CONFIG ############
Monitor.enable_monitor=false
Monitor.decimation_factor=1
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
